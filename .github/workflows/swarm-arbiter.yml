name: Swarm Arbiter

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  arbiter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Arbiter
        run: python arbiter_fixed.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
