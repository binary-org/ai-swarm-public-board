name: Swarm Guardian

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Guardian
        run: python guardian.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
